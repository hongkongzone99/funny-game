<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <title>超級誠實大測試</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
      background-color: #f0f4f8;
      overflow: hidden;
    }
    h1 {
      color: #333;
    }
    .btn-container {
      margin-top: 20px;
      position: relative;
      width: 300px;
      height: 100px;
    }
    button {
      padding: 12px 24px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      position: absolute;
    }
    #yesBtn {
      background-color: #4CAF50;
      color: white;
      left: 20px;
    }
    #noBtn {
      background-color: #f44336;
      color: white;
      right: 20px;
      transition: all 0.15s ease;
    }
  </style>
</head>
<body>

  <h1>你認唔認自己係全宇宙最傻嘅人？</h1>

  <div class="btn-container">
    <button id="yesBtn" onclick="alert('我就知你咁老實！今晚請食飯啦！')">認</button>
    <button id="noBtn" onmouseover="dodge()">唔認</button>
  </div>

  <script>
    function dodge() {
      const btn = document.getElementById('noBtn');
      // 隨機跳去螢幕唔同角落，令朋友永遠撳唔到「唔認」
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 50);
      btn.style.position = 'fixed';
      btn.style.left = x + 'px';
      btn.style.top = y + 'px';
    }
  </script>

</body>
</html>
